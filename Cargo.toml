[package]
name = "nexus"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Nexus: a production-oriented async kernel for autonomous agents (spawn, supervise, route)."

[lib]
name = "nexus"
path = "src/lib.rs"

[[bin]]
name = "nexus-demo"
path = "src/bin/demo.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full", "signal"] }
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio-util = "0.7"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
dirs = "5.0"

# WebAssembly support
wasmtime = { version = "28.0", optional = true }
wasmtime-wasi = { version = "28.0", optional = true }

# Language bridges
bincode = "1.3"
base64 = "0.22"

# Distributed registry
reqwest = { version = "0.12", features = ["json"], optional = true }
hyper = { version = "1.0", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["full"], optional = true }
http-body-util = "0.1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = []
wasm = ["wasmtime", "wasmtime-wasi"]
distributed = ["reqwest", "hyper", "hyper-util"]
full = ["wasm", "distributed"]

[[bench]]
name = "message_throughput"
harness = false
