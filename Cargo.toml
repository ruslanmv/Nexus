[package]
name = "nexus"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Nexus: a production-oriented async kernel for autonomous agents (spawn, supervise, route)."

[lib]
name = "nexus"
path = "src/lib.rs"

[[bin]]
name = "nexus-demo"
path = "src/bin/demo.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full", "signal"] }
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio-util = "0.7"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
dirs = "5.0"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "message_throughput"
harness = false
