[package]
name = "nexus"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Nexus: a production-oriented async kernel for autonomous agents (spawn, supervise, route)."

[lib]
name = "nexus"
path = "src/lib.rs"

[[bin]]
name = "nexus-demo"
path = "src/bin/demo.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dashmap = "5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio-util = "0.7"

[dev-dependencies]
proptest = "1"
