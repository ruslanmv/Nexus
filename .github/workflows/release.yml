name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.1.0)"
        required: true
        type: string

# REQUIRED to fix: "Resource not accessible by integration"
permissions:
  contents: write   # create release + upload assets
  packages: write   # push to GHCR (docker)

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Nexus ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Nexus ${{ steps.get_version.outputs.version }}

            The Universal Standard Kernel for Agentic AI

            ### 📦 Installation

            #### Quick Install (Linux/macOS)
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            #### Download Binary
            Download the appropriate binary for your platform below.

            #### From Source
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ steps.get_version.outputs.version }}
            ```

            ### 📝 Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### 🔗 Quick Start
            ```bash
            # Run with default configuration
            nexus-runtime

            # Run with custom settings
            nexus-runtime -n 10 -d 30

            # Generate a config file
            nexus-runtime --generate-config config.toml
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # Linux x86_64 (musl - static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # macOS ARM64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCHIVE_DIR="nexus-${VERSION}-${{ matrix.target }}"
          ARCHIVE_FILE="${ARCHIVE_DIR}.tar.gz"

          mkdir -p "${ARCHIVE_DIR}"

          # Binary name (Unix)
          BIN_PATH="target/${{ matrix.target }}/release/nexus-runtime"
          if [ -f "${BIN_PATH}" ]; then
            cp "${BIN_PATH}" "${ARCHIVE_DIR}/"
          else
            echo "ERROR: binary not found at ${BIN_PATH}"
            ls -la "target/${{ matrix.target }}/release" || true
            exit 1
          fi

          # Optional docs/files
          cp README.md LICENSE CHANGELOG.md "${ARCHIVE_DIR}/" 2>/dev/null || true
          cp -r bridges examples scripts "${ARCHIVE_DIR}/" 2>/dev/null || true

          tar czf "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"

          echo "ARCHIVE_PATH=${ARCHIVE_FILE}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_FILE}" >> $GITHUB_ENV

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          $ARCHIVE_DIR = "nexus-$VERSION-${{ matrix.target }}"
          $ARCHIVE_FILE = "$ARCHIVE_DIR.zip"

          New-Item -ItemType Directory -Path $ARCHIVE_DIR -Force | Out-Null

          $BIN_PATH = "target/${{ matrix.target }}/release/nexus-runtime.exe"
          if (Test-Path $BIN_PATH) {
            Copy-Item $BIN_PATH "$ARCHIVE_DIR/"
          } else {
            Write-Host "ERROR: binary not found at $BIN_PATH"
            Get-ChildItem "target/${{ matrix.target }}/release" -ErrorAction SilentlyContinue
            exit 1
          }

          Copy-Item "README.md","LICENSE","CHANGELOG.md" "$ARCHIVE_DIR/" -ErrorAction SilentlyContinue
          Copy-Item "bridges","examples","scripts" "$ARCHIVE_DIR/" -Recurse -ErrorAction SilentlyContinue

          Compress-Archive -Path $ARCHIVE_DIR -DestinationPath $ARCHIVE_FILE -Force

          "ARCHIVE_PATH=$ARCHIVE_FILE" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARCHIVE_NAME=$ARCHIVE_FILE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ${{ env.ARCHIVE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build Docker Image
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.create-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features
