name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.3.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Nexus ${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 Nexus ${{ steps.get_version.outputs.version }}

            The Universal Standard Kernel for Agentic AI

            ### 📦 Installation

            #### Quick Install (Linux/macOS)
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            #### Download Binary
            Download the appropriate binary for your platform below.

            #### From Source
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ steps.get_version.outputs.version }}
            ```

            ### 📝 Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ### 🔗 Quick Start
            ```bash
            # Run with default configuration
            nexus-runtime

            # Run with custom settings
            nexus-runtime -n 10 -d 30

            # Generate config file
            nexus-runtime --generate-config config.toml
            ```
          draft: false
          prerelease: false

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # Linux x86_64 (musl - static linking)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # macOS ARM64 (M1/M2)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --all-features

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          ARCHIVE_NAME="nexus-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"

          # Copy binary
          if [ -f "target/${{ matrix.target }}/release/nexus-runtime" ]; then
            cp "target/${{ matrix.target }}/release/nexus-runtime" "${ARCHIVE_NAME}/"
          fi

          # Copy additional files
          cp README.md LICENSE CHANGELOG.md "${ARCHIVE_NAME}/" || true
          cp -r bridges examples scripts "${ARCHIVE_NAME}/" || true

          # Create archive
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ARCHIVE_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          $ARCHIVE_NAME = "nexus-${VERSION}-${{ matrix.target }}"

          New-Item -ItemType Directory -Path $ARCHIVE_NAME -Force

          # Copy binary
          if (Test-Path "target/${{ matrix.target }}/release/nexus-runtime.exe") {
            Copy-Item "target/${{ matrix.target }}/release/nexus-runtime.exe" "$ARCHIVE_NAME/"
          }

          # Copy additional files
          Copy-Item "README.md", "LICENSE", "CHANGELOG.md" "$ARCHIVE_NAME/" -ErrorAction SilentlyContinue
          Copy-Item "bridges", "examples", "scripts" "$ARCHIVE_NAME/" -Recurse -ErrorAction SilentlyContinue

          # Create archive
          Compress-Archive -Path $ARCHIVE_NAME -DestinationPath "${ARCHIVE_NAME}.zip"
          echo "ARCHIVE_PATH=${ARCHIVE_NAME}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.ARCHIVE_PATH }}
          asset_name: ${{ env.ARCHIVE_NAME }}
          asset_content_type: application/octet-stream

  build-docker:
    name: Build Docker Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.create-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.create-release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.create-release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features

  create-installers:
    name: Create Installers
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Debian package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"

          # Create directory structure
          mkdir -p nexus_${VERSION_NO_V}_amd64/DEBIAN
          mkdir -p nexus_${VERSION_NO_V}_amd64/usr/local/bin
          mkdir -p nexus_${VERSION_NO_V}_amd64/etc/nexus
          mkdir -p nexus_${VERSION_NO_V}_amd64/usr/share/doc/nexus

          # Download binary (placeholder - in real scenario download from release)
          # For now, we'll note this needs the binary from previous jobs

          # Create control file
          cat > nexus_${VERSION_NO_V}_amd64/DEBIAN/control << EOF
          Package: nexus
          Version: ${VERSION_NO_V}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Nexus Maintainers <nexus@example.com>
          Description: The Universal Standard Kernel for Agentic AI
           Nexus is a production-grade async kernel for autonomous agents.
           Built in Rust with Tokio, it provides the execution substrate
           for spawning, supervising, and routing thousands of concurrent
           agents with deterministic behavior and operational safety.
          EOF

          # Copy documentation
          cp README.md nexus_${VERSION_NO_V}_amd64/usr/share/doc/nexus/
          cp LICENSE nexus_${VERSION_NO_V}_amd64/usr/share/doc/nexus/

          echo "Debian package structure created"

      - name: Create RPM spec
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cat > rpmbuild/SPECS/nexus.spec << EOF
          Name:           nexus
          Version:        ${VERSION_NO_V}
          Release:        1%{?dist}
          Summary:        The Universal Standard Kernel for Agentic AI

          License:        Apache-2.0
          URL:            https://github.com/${{ github.repository }}

          %description
          Nexus is a production-grade async kernel for autonomous agents.
          Built in Rust with Tokio, it provides the execution substrate
          for spawning, supervising, and routing thousands of concurrent
          agents with deterministic behavior and operational safety.

          %prep

          %build

          %install
          mkdir -p %{buildroot}/%{_bindir}
          mkdir -p %{buildroot}/%{_sysconfdir}/nexus

          %files
          %license LICENSE
          %doc README.md
          %{_bindir}/nexus-runtime
          %config(noreplace) %{_sysconfdir}/nexus/config.toml

          %changelog
          * $(date +'%a %b %d %Y') Nexus Maintainers <nexus@example.com> - ${VERSION_NO_V}-1
          - Release ${VERSION_NO_V}
          EOF

          echo "RPM spec created"

  update-homebrew:
    name: Update Homebrew Formula
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create Homebrew formula
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"

          cat > nexus.rb << EOF
          class Nexus < Formula
            desc "The Universal Standard Kernel for Agentic AI"
            homepage "https://github.com/${{ github.repository }}"
            url "https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz"
            license "Apache-2.0"

            depends_on "rust" => :build

            def install
              system "cargo", "install", "--locked", "--root", prefix, "--path", "."

              # Install configuration
              (etc/"nexus").mkpath
              (etc/"nexus/config.toml").write <<~EOS
                [kernel]
                mailbox_capacity = 1024
                send_timeout_ms = 500
                handle_timeout_ms = 30000

                [logging]
                level = "info"
                format = "compact"
              EOS
            end

            test do
              assert_match "Nexus", shell_output("#{bin}/nexus-runtime --version")
            end
          end
          EOF

          echo "Homebrew formula created. Submit to homebrew-core or create tap."
          cat nexus.rb
